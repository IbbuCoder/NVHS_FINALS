<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Data | Finals</title>
<meta name="theme-color" content="#15171a">
<script>
// Same look settings as the main site. Dark mode is the default.
try {
  var s = (JSON.parse(localStorage.getItem('finals-v1')) || {}).settings || {}, r = document.documentElement;
  r.dataset.theme = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (s.theme || 'dark');
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="./hq.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="brand">Finals data</span>
  </div>
</header>

<main id="main">
  <div class="wrap narrow">

    <!-- Shown until a key is given -->
    <section id="hq-lock" hidden>
      <header class="unit-head"><h1 tabindex="-1">Data</h1></header>
      <form id="hq-key-form" class="share-form" novalidate>
        <div class="set-row">
          <label class="set-label" for="hq-key">Admin key</label>
          <input class="text-input" id="hq-key" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off">
        </div>
        <div class="test-actions"><button type="submit" class="btn solid">Open</button></div>
      </form>
      <h2 class="set-group">Or log in as the owner</h2>
      <form id="hq-login-form" class="share-form" novalidate>
        <div class="set-row">
          <label class="set-label" for="hq-user">Username</label>
          <input class="text-input" id="hq-user" type="text" autocomplete="username" spellcheck="false" autocapitalize="off" maxlength="40">
        </div>
        <div class="set-row">
          <label class="set-label" for="hq-pin">PIN</label>
          <div class="pin-row"><input class="text-input" id="hq-pin" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off" maxlength="64"><button type="button" class="btn" id="hq-pin-toggle" aria-controls="hq-pin" aria-pressed="false">Show</button></div>
        </div>
        <div class="test-actions"><button type="submit" class="btn solid" id="hq-login-go">Log in</button></div>
      </form>
    </section>

    <!-- Shown once the key works -->
    <section id="hq-panel" hidden>
      <header class="unit-head sheet-head"><h1 tabindex="-1">Data</h1>
        <div class="hq-tools"><button type="button" class="btn solid" id="hq-refresh">Refresh</button><button type="button" class="btn ghost" id="hq-lockbtn">Lock</button></div>
      </header>
      <div class="hq-stats" id="hq-stats"></div>

      <h2 class="set-group">Stats</h2>
      <div id="hq-charts"></div>

      <h2 class="set-group">Messages</h2>
      <div id="hq-msgs"></div>

      <h2 class="set-group">Feedback</h2>
      <div class="hq-filters">
        <div class="seg" id="hq-fb-filter" role="group" aria-label="Show feedback">
          <button type="button" data-filter="new">New</button>
          <button type="button" data-filter="done">Done</button>
          <button type="button" data-filter="all">All</button>
        </div>
        <div class="seg" id="hq-fb-sort" role="group" aria-label="Sort feedback">
          <button type="button" data-sort="date">Newest</button>
          <button type="button" data-sort="kind">By kind</button>
        </div>
      </div>
      <div id="hq-feedback"></div>

      <h2 class="set-group">Notebooks</h2>
      <div id="hq-notebooks"></div>

      <h2 class="set-group">Accounts</h2>
      <div id="hq-accounts"></div>

      <h2 class="set-group">This device</h2>
      <p class="note">Stop your own visits on this browser from showing up in the stats.</p>
      <button type="button" class="btn" id="hq-exclude">Don't count this device</button>
    </section>

    <div class="form-result hq-msg" id="hq-msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../supabase/config.js"></script>
<script src="../js/registry.js"></script>
<script src="../data/subjects.js"></script>
<script src="./hq.js"></script>
</body>
</html>
