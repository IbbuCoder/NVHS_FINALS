<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
  <!-- Set the theme before the page draws, so dark mode doesn't flash white. -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/category.js" defer></script>
  <title>Classes · Finals Study Guide</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">✏️</span>
        <span class="brand-text">
          <span class="brand-title" data-site-title>Finals Study Guide</span>
          <span class="brand-school" data-school-name hidden></span>
        </span>
      </a>
      <nav class="header-nav" aria-label="Main">
        <a href="share.html">Share<span class="wide-only"> a notebook</span></a>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="visually-hidden">Dark mode</span>
      </button>
    </div>
  </header>
  <main id="main" class="wrap">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
    <header class="page-header" id="category-header">
      <h1 id="category-title">Classes</h1>
      <p class="lede" id="category-blurb"></p>
    </header>
    <ul class="subject-grid" id="subject-grid" aria-labelledby="category-title"></ul>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Made by students, for students. Not an official school site.</p>
      <p><a href="share.html">Share your NotebookLM notebook</a></p>
    </div>
  </footer>
</body>
</html>
