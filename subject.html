<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%231f45b5%22/><path d=%22M7 11h18M7 17h18M7 23h12%22 stroke=%22white%22 stroke-width=%222.5%22/></svg>">
  <!-- Set the theme before the page draws, so dark mode doesn't flash white. -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/flashcards.js" defer></script>
  <script src="js/quiz.js" defer></script>
  <script src="js/subject.js" defer></script>
  <title>Study | Finals Study Guide</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-title" data-site-title>Finals Study Guide</span>
        <span class="brand-school" data-school-name hidden></span>
      </a>
      <nav class="header-nav" aria-label="Main">
        <a href="share.html">Share<span class="wide-only"> a notebook</span></a>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false">
        <!-- half-filled circle = light/dark -->
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
        <span class="visually-hidden">Dark mode</span>
      </button>
    </div>
  </header>
  <main id="main" class="wrap">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
    <!-- Everything below is built by subject.js from the subject's data file -->
    <div id="subject-root">
      <p class="loading">Loading…</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Written and run by students. This is not an official school website.</p>
      <p><a href="share.html">Share a NotebookLM notebook</a></p>
    </div>
  </footer>
</body>
</html>
